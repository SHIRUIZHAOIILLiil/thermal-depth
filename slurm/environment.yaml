name: iris
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      # torch 系：cu121 wheel，对应 L40S 的 Ada sm_89
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.3.1
      - torchvision==0.18.1
      - torchaudio==2.3.1
      # lotus/requirements.txt
      - accelerate==0.29.3
      - datasets==2.19.0
      - diffusers==0.28.0
      - easydict==1.13
      - ftfy==6.2.0
      - geffnet==1.0.2
      - h5py==3.11.0
      - huggingface-hub==0.22.2
      - imageio==2.34.2
      - imageio-ffmpeg==0.5.1
      - Jinja2==3.1.3
      - matplotlib==3.8.4
      - numpy==1.26.4
      - omegaconf==2.3.0
      - opencv-python-headless==4.9.0.80
      - peft==0.7.0
      - tabulate==0.9.0
      - tensorboard==2.16.2
      - transformers==4.40.1
      # train_iris_d.sh 用了 --use_8bit_adam，但 requirements.txt 里没列
      - bitsandbytes==0.43.1
      # 任务 4：BMSD 的 MiDaS/DPT 骨干要 timm，且必须是老版 —— 它用
      # vit_deit_base_patch16_384 / vit_base_resnet50_384 这些在 timm 0.9+
      # 已改名的模型，还依赖 patch_embed.backbone.stages 这类内部结构。
      # 0.6.12 是 MiDaS 官方钉的版本。
      - timm==0.6.12
      # 天空掩码：Mask2Former 的 __init__ 无条件构造 Mask2FormerLoss，其匈牙利
      # 匹配要 scipy.optimize —— 纯推理也躲不掉，缺了会在建模型时直接 ImportError。
      # 1.13.x 是最后一批按 numpy 1.x ABI 编的 wheel；1.14+ 按 numpy 2.0 编，
      # 与上面钉死的 numpy==1.26.4 不兼容。
      - scipy==1.13.1
