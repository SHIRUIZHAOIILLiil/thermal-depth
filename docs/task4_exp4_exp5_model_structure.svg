<svg width="680" height="592" viewBox="0 0 680 592" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','微软雅黑','Segoe UI',sans-serif">
<title>实验4/5 模型结构（含梯度回传）</title>
<desc>热像经冻结 Lotus VAE 编码为条件，送入可训 U-Net，fp32 解码取通道均值得预测视差。预测视差同时被真值 GT 损失和 AnyThermal 稠密伪GT损失监督；两个损失的梯度在预测视差处汇合，反向穿过冻结解码器回到 U-Net，只更新 U-Net。实验4与实验5仅在稠密损失的对齐方式上不同。</desc>
<style>
text{fill:#2C2C2A}
.th{font-size:14px;font-weight:500}
.t{font-size:14px}
.ts{font-size:12px}
.box-gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.6}
.box-coral{fill:#FAECE7;stroke:#993C1D;stroke-width:.6}
.box-blue{fill:#E6F1FB;stroke:#185FA5;stroke-width:.6}
.box-teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.6}
.tt-gray{fill:#444441}.st-gray{fill:#5F5E5A}
.tt-coral{fill:#712B13}.st-coral{fill:#993C1D}
.tt-blue{fill:#0C447C}.st-blue{fill:#185FA5}
.tt-teal{fill:#085041}.st-teal{fill:#0F6E56}
.fwd{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.grad{stroke:#D85A30;stroke-width:1.5;fill:none;stroke-dasharray:5 3}
</style>
<defs>
<marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="592" fill="#FFFFFF"/>

<rect x="40" y="12" width="600" height="30" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="340" y="31" text-anchor="middle" fill="#0C447C">黑箭头 = 前向；珊瑚虚线 = 梯度回传。只更新 U-Net，VAE 与 teacher 全程冻结</text>

<rect x="190" y="50" width="300" height="48" rx="6" class="box-gray"/><text class="th tt-gray" x="340" y="72" text-anchor="middle">热像输入</text><text class="ts st-gray" x="340" y="90" text-anchor="middle">[B,3,256,640]</text>
<line class="fwd" x1="340" y1="98" x2="340" y2="118" marker-end="url(#af)"/>

<rect x="190" y="118" width="300" height="58" rx="6" class="box-gray"/><text class="th tt-gray" x="340" y="142" text-anchor="middle">冻结 Lotus VAE 编码（不训练）</text><text class="ts st-gray" x="340" y="161" text-anchor="middle">→ 条件 latent [B,4,32,80]</text>
<line class="fwd" x1="340" y1="176" x2="340" y2="194" marker-end="url(#af)"/>

<rect x="190" y="194" width="300" height="58" rx="6" class="box-coral"/><text class="th tt-coral" x="340" y="218" text-anchor="middle">可训 U-Net（唯一被训练的部分）</text><text class="ts st-coral" x="340" y="237" text-anchor="middle">cat [B,8,32,80] → x0 [B,4,32,80]</text>
<line class="fwd" x1="340" y1="252" x2="340" y2="270" marker-end="url(#af)"/>

<rect x="190" y="270" width="300" height="58" rx="6" class="box-gray"/><text class="th tt-gray" x="340" y="294" text-anchor="middle">fp32 VAE 解码 · 通道均值</text><text class="ts st-gray" x="340" y="313" text-anchor="middle">→ 预测视差 [B,256,640]</text>

<line class="fwd" x1="340" y1="328" x2="340" y2="342"/>
<path class="fwd" d="M220 342 L460 342"/>
<line class="fwd" x1="220" y1="342" x2="220" y2="354" marker-end="url(#af)"/>
<line class="fwd" x1="460" y1="342" x2="460" y2="354" marker-end="url(#af)"/>

<path class="grad" d="M190 314 L100 314 L100 223 L190 223" marker-end="url(#ab)"/>
<text class="ts" x="106" y="266" fill="#993C1D">梯度回传</text>
<text class="ts" x="106" y="282" fill="#993C1D">两损失在此汇合</text>
<text class="ts" x="106" y="298" fill="#993C1D">只更新 U-Net</text>

<rect x="120" y="354" width="200" height="72" rx="6" class="box-blue"/><text class="th tt-blue" x="220" y="378" text-anchor="middle">损失③：真值 GT（λ=5）</text><text class="ts st-blue" x="220" y="397" text-anchor="middle">masked SSI-L1 · 会回传</text><text class="ts st-blue" x="220" y="415" text-anchor="middle">仅 ~29% 像素有真值</text>

<rect x="360" y="354" width="200" height="72" rx="6" class="box-blue"/><text class="th tt-blue" x="460" y="378" text-anchor="middle">稠密 teacher 损失（w=1）</text><text class="ts st-blue" x="460" y="397" text-anchor="middle">补足其余 ~71% 像素 · 会回传</text><text class="ts st-blue" x="460" y="415" text-anchor="middle">↓ 对齐方式 = 实验4/5 差别</text>

<rect x="500" y="186" width="140" height="104" rx="6" class="box-gray" stroke-dasharray="4 3"/><text class="ts st-gray" x="570" y="206" text-anchor="middle">不参与训练/推理</text><text class="th tt-gray" x="570" y="226" text-anchor="middle">AnyThermal（冻结）</text><text class="ts st-gray" x="570" y="244" text-anchor="middle">离线逐帧生成</text><text class="ts st-gray" x="570" y="262" text-anchor="middle">已用真值校准</text><text class="ts st-gray" x="570" y="280" text-anchor="middle">→ 稠密「伪 GT」标签</text>
<path class="fwd" d="M570 290 L570 316 L610 316 L610 389 L560 389" marker-end="url(#af)"/>

<rect x="40" y="118" width="150" height="54" rx="6" class="box-gray" stroke-dasharray="4 3"/><text class="ts st-gray" x="115" y="137" text-anchor="middle">对照原图两损失</text><text class="ts st-gray" x="115" y="153" text-anchor="middle">① 条件蒸馏 —— 无</text><text class="ts st-gray" x="115" y="169" text-anchor="middle">② 响应约束 —— 权重 0</text>

<line class="fwd" x1="460" y1="426" x2="460" y2="440"/>
<path class="fwd" d="M240 440 L510 440"/>
<line class="fwd" x1="240" y1="440" x2="240" y2="452" marker-end="url(#af)"/>
<line class="fwd" x1="510" y1="440" x2="510" y2="452" marker-end="url(#af)"/>

<rect x="110" y="452" width="260" height="86" rx="6" class="box-teal"/><text class="th tt-teal" x="240" y="476" text-anchor="middle">实验4（C′）：只对「形状」</text><text class="ts st-teal" x="240" y="495" text-anchor="middle">允许整体缩放 / 平移对齐</text><text class="ts st-teal" x="240" y="512" text-anchor="middle">数值范围没人管 → 会漂</text><text class="ts st-teal" x="240" y="529" text-anchor="middle">漂移 32% · AbsRel 0.169</text>

<rect x="380" y="452" width="260" height="86" rx="6" class="box-teal"/><text class="th tt-teal" x="510" y="476" text-anchor="middle">实验5（C″）：形状 + 数值都对</text><text class="ts st-teal" x="510" y="495" text-anchor="middle">不许缩放 / 平移</text><text class="ts st-teal" x="510" y="512" text-anchor="middle">数值范围被钉在真值上</text><text class="ts st-teal" x="510" y="529" text-anchor="middle">漂移 0% · AbsRel 0.086（最佳）</text>

<rect x="40" y="552" width="14" height="14" rx="3" class="box-gray"/><text class="ts" x="60" y="563">冻结 / 离线</text>
<rect x="168" y="552" width="14" height="14" rx="3" class="box-coral"/><text class="ts" x="188" y="563">可训练 U-Net</text>
<rect x="318" y="552" width="14" height="14" rx="3" class="box-blue"/><text class="ts" x="338" y="563">训练损失（回传）</text>
<rect x="478" y="552" width="14" height="14" rx="3" class="box-teal"/><text class="ts" x="498" y="563">实验 4 / 5 差异</text>
</svg>
